---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits/finalizers
  verbs:
  - update
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits/status
  verbs:
  - get
  - patch
  - update
