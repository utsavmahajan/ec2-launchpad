# This rule is not used by the project ec2-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to dispatch.ec2-launchpad.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ec2-operator
    app.kubernetes.io/managed-by: kustomize
  name: clusterinit-viewer-role
rules:
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits/status
  verbs:
  - get
