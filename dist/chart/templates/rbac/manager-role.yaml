apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "ec2-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits/finalizers
  verbs:
  - update
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits/status
  verbs:
  - get
  - patch
  - update
