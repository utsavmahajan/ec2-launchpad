{{- if .Values.rbac.enable }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    {{- include "chart.labels" . | nindent 4 }}
  name: ec2-operator-manager-role
rules:
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits/finalizers
  verbs:
  - update
- apiGroups:
  - dispatch.ec2-launchpad.io
  resources:
  - clusterinits/status
  verbs:
  - get
  - patch
  - update
{{- end -}}
